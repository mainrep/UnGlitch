<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>UnGlitch | Map</title>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#0F111A">
        <script>
            const map = L.map('map').setView([51.505, -0.09], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);
        </script>
    </head>
    <body>
        <header class="Header">
            <a href="index.html" class="logo-link">
                <span>
                    <img class="logo-image" src="logo.png" alt="logo" style="height: 36px; width: auto;">
                </span>
                <span class="AppName">
                    UnGlitch
                </span>
            </a>
            <nav class="NavigationBar">
                <a class="NavBar" href="index.html">
                    <span class="SpacedWord">Homepage</span>
                    <img src="homeDM.svg" alt="home_icon" class="icons" width="20" height="20"> 
                </a> 
                <a class="NavBar" href="repair.html">
                    <span class="SpacedWord">Repair</span> 
                    <img src="repairDM.svg" alt="repair_icon" class="icons" width="20" height="20">
                </a>
                <a class="NavBar" href="map.html">
                    <span class="SpacedWord">Map</span> 
                    <img src="mapDM.svg" alt="map_icon" class="icons" width="20" height="20">
                </a>
                <a class="NavBar" href="profile.html">
                    <span class="SpacedWord">Profile</span>
                    <img src="profileDM.svg" alt="profile_icon" class="icons" width="20" height="20"> 
                </a>
            </nav>
        </header>
        <h1>Map</h1>
        <form id="shopInput">
            <input type="text" id="shop" placeholder="Search nearest repair shop">
        </form>
        <div id="map">

        </div>
        <br>
    </body>
</html>
