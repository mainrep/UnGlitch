services:
  - type: web
    name: unglitch-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_CLIENT_ID
        value: 863730349111-esfr6n6glra8u7a9oeb6vdlifnugblca.apps.googleusercontent.com
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://mainrep.github.io,http://127.0.0.1:5501,http://localhost:5501
      - key: ALLOW_LOCAL_PREVIEW
        value: "false"
